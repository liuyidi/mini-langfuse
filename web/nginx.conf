server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API to the server container (name resolved by docker-compose)
    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback so /traces/:id etc. serves index.html
    location / {
        try_files $uri /index.html;
    }
}
