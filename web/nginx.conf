server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE streaming endpoint - disable buffering for real-time events (M10)
    location /api/ui/stream {
        proxy_pass http://server:8000/api/ui/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;  # Keep connection open for 24h
    }

    # Proxy API to the server container (name resolved by docker-compose)
    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback so /traces/:id etc. serves index.html
    location / {
        try_files $uri /index.html;
    }
}
