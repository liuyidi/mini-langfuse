[project]
name = "mini-langfuse-worker"
version = "0.1.0"
description = "Mini Langfuse background worker (Redis -> ClickHouse)"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0",
]

[project.scripts]
mini-langfuse-worker = "mini_langfuse_worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mini_langfuse_worker*"]
