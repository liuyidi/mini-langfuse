[project]
name = "mini-langfuse-server"
version = "0.1.0"
description = "Mini Langfuse - server (FastAPI + SQLAlchemy)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=2.2",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
