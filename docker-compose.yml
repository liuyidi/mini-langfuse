services:
  server:
    build: ./server
    container_name: mlf-server
    ports:
      - "8000:8000"
    environment:
      MLF_DATABASE_URL: sqlite:////data/mini_langfuse.db
      # Comma-separated allowed origins. Loosely permissive for local demos.
      MLF_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - mlf_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./web
    container_name: mlf-web
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mlf_data:
