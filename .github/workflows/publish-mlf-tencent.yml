name: Publish MLF (Tencent)

# Rebuild mlf web + server on the Tencent Lighthouse host
# (mlf.liuyidi.me → /opt/mlf/mini-langfuse), then notify Feishu via ServerlessShip.
#
# Required repo settings:
#   secrets: MLF_SSH_PRIVATE_KEY, SERVERLESSSHIP_TOKEN (optional SERVERLESSSHIP_TOKEN_MLF)
#   vars:    MLF_HOST, MLF_SSH_USER (optional MLF_SSH_PORT, SERVERLESSSHIP_RELEASE_URL)
#
# Trigger: push to main touching app/deploy paths, or Actions → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "sdk-python/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".github/workflows/publish-mlf-tencent.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-mlf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MLF_HOST: ${{ vars.MLF_HOST || '124.223.108.72' }}
      MLF_SSH_USER: ${{ vars.MLF_SSH_USER || 'ubuntu' }}
      MLF_SSH_PORT: ${{ vars.MLF_SSH_PORT || 22 }}

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Require MLF_HOST
        run: |
          set -euo pipefail
          if [[ -z "${MLF_HOST:-}" ]]; then
            echo "Set repository variable MLF_HOST to the Tencent public IP (or hostname)." >&2
            exit 1
          fi

      - name: Resolve deploy metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Pull mini-langfuse commit on host
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.MLF_HOST }}
          username: ${{ env.MLF_SSH_USER }}
          key: ${{ secrets.MLF_SSH_PRIVATE_KEY }}
          port: ${{ env.MLF_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            git config --global --add safe.directory /opt/mlf/mini-langfuse
            cd /opt/mlf/mini-langfuse
            git fetch origin "${{ github.sha }}"
            git reset --hard "${{ github.sha }}"
            echo "HEAD=$(git rev-parse --short HEAD)"
            git log -1 --oneline

      - name: Rebuild and restart stack
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.MLF_HOST }}
          username: ${{ env.MLF_SSH_USER }}
          key: ${{ secrets.MLF_SSH_PRIVATE_KEY }}
          port: ${{ env.MLF_SSH_PORT }}
          command_timeout: 35m
          script: |
            set -euo pipefail
            cd /opt/mlf/mini-langfuse
            ./deploy/up.sh
            docker ps --filter name=mlf- --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

      - name: Wait for local health
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.MLF_HOST }}
          username: ${{ env.MLF_SSH_USER }}
          key: ${{ secrets.MLF_SSH_PRIVATE_KEY }}
          port: ${{ env.MLF_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            ok=0
            for i in $(seq 1 40); do
              if curl -fsS --max-time 3 http://127.0.0.1:8000/health >/tmp/mlf-health.json \
                || curl -fsS --max-time 3 http://127.0.0.1:8080/ >/dev/null; then
                echo "health ok after ${i} attempt(s)"
                ok=1
                break
              fi
              echo "waiting for mlf health (${i}/40)..."
              sleep 3
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "mlf health check failed; recent logs:"
              docker logs mlf-server --tail 120 || true
              docker logs mlf-web --tail 80 || true
              exit 1
            fi

      - name: Verify public URL
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -w "public mlf %{http_code}\n" https://mlf.liuyidi.me/ || true

  notify-serverlessship:
    needs: publish-mlf
    if: ${{ needs.publish-mlf.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVERLESSSHIP_RELEASE_URL: ${{ vars.SERVERLESSSHIP_RELEASE_URL }}
      SERVERLESSSHIP_TOKEN: ${{ secrets.SERVERLESSSHIP_TOKEN_MLF || secrets.SERVERLESSSHIP_TOKEN }}

    steps:
      - name: Send deploy notification to ServerlessShip
        run: |
          set -euo pipefail

          if [[ -z "${SERVERLESSSHIP_TOKEN:-}" ]]; then
            echo "Missing SERVERLESSSHIP_TOKEN_MLF (or SERVERLESSSHIP_TOKEN) secret." >&2
            exit 1
          fi

          serverlessship_release_url="${SERVERLESSSHIP_RELEASE_URL:-https://serverless-ship.liuyidi.me/api/releases}"

          payload="$(node -e 'process.stdout.write(JSON.stringify({
            project: "mini-langfuse",
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            releaseUrl: process.env.RELEASE_URL,
            workflowUrl: process.env.WORKFLOW_URL,
            channel: "Tencent Lighthouse",
          }));')"

          response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${SERVERLESSSHIP_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$serverlessship_release_url"
          )"

          echo "$response"
        env:
          RELEASE_VERSION: ${{ needs.publish-mlf.outputs.short_sha }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_URL: https://mlf.liuyidi.me/
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
