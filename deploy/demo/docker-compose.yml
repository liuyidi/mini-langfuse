# Interview / demo stack: mini-langfuse + minikb + minibot on one small ECS (2C2G).
#
# Expected sibling layout (see README.md):
#   /opt/demo/
#     mini-langfuse/
#     minikb/
#     minibot/
#
# From this directory:
#   cp .env.example .env   # edit secrets + paths if needed
#   ./up.sh
#
# Defaults assume compose is run with paths relative to mini-langfuse/deploy/demo:
#   MLF=../..  MINIKB=../../../minikb  MINIBOT=../../../minibot

name: agent-demo

services:
  postgres:
    # DaoCloud mirror — direct docker.io often times out on CN mainland ECS
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: minilangfuse
    volumes:
      - demo_pg:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/02-init-demo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo} -d minilangfuse"]
      interval: 10s
      timeout: 5s
      retries: 8
    mem_limit: 384m
    networks: [demo]

  # Optional for minikb uploads; skip with: docker compose --profile full ...
  minio:
    image: docker.m.daocloud.io/minio/minio:latest
    container_name: demo-minio
    restart: unless-stopped
    profiles: ["full", "kb"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - demo_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 8
    mem_limit: 192m
    networks: [demo]

  minio-bootstrap:
    image: docker.m.daocloud.io/minio/mc:latest
    profiles: ["full", "kb"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/minikb &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks: [demo]

  # Service name must stay "server" — web/nginx.conf proxies to http://server:8000
  server:
    build:
      context: ${MLF_DIR:-../..}/server
    image: demo-mlf-server:local
    container_name: demo-mlf-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD}@postgres:5432/minilangfuse
      MLF_CORS_ORIGINS: ${MLF_CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      MLF_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MLF_OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    mem_limit: 384m
    networks: [demo]

  web:
    build:
      context: ${MLF_DIR:-../..}/web
    image: demo-mlf-web:local
    container_name: demo-mlf-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    mem_limit: 64m
    networks: [demo]

  minikb:
    build:
      context: ${MINIKB_DIR:-../../../minikb}
      dockerfile: docker/Dockerfile.ecs
    image: demo-minikb:local
    container_name: demo-minikb
    restart: unless-stopped
    profiles: ["full", "kb"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MINIKB_ENV: ${MINIKB_ENV:-dev}
      MINIKB_HOST: 0.0.0.0
      MINIKB_PORT: "8080"
      MINIKB_POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD}@postgres:5432/minikb
      MINIKB_REDIS_URL: redis://127.0.0.1:6379/0
      MINIKB_S3_ENDPOINT: minio:9000
      MINIKB_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIKB_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIKB_S3_BUCKET: minikb
      MINIKB_S3_SECURE: "false"
      MINIKB_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MINIKB_OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      # DeepSeek has no /embeddings; auto→mock. Override to openai when using a real embed API.
      MINIKB_EMBEDDING_PROVIDER: ${MINIKB_EMBEDDING_PROVIDER:-auto}
      MINIKB_REQUIRE_API_KEY: "false"
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 384m
    networks: [demo]

  minibot:
    build:
      # Monorepo root so Docker can build webui/ + minibot/
      context: ${MINIBOT_REPO_DIR:-../../../minibot}
      dockerfile: Dockerfile.minibot
      additional_contexts:
        langfuse_sdk: ${MLF_DIR:-../..}/sdk-python
    image: demo-minibot:local
    container_name: demo-minibot
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      MINIBOT_SERVER_HOST: 0.0.0.0
      MINIBOT_SERVER_PORT: "8766"
      # Default / DeepSeek Flash slot (legacy OPENAI_* aliases still work)
      MINIBOT_SERVER_OPENAI_API_KEY: ${MINIBOT_SERVER_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      MINIBOT_SERVER_OPENAI_BASE_URL: ${MINIBOT_SERVER_OPENAI_BASE_URL:-${OPENAI_BASE_URL:-https://api.deepseek.com/v1}}
      MINIBOT_SERVER_OPENAI_MODEL: ${MINIBOT_SERVER_OPENAI_MODEL:-${MINIBOT_MODEL:-deepseek-v4-flash}}
      MINIBOT_SERVER_MODEL: ${MINIBOT_SERVER_MODEL:-${MINIBOT_MODEL:-deepseek-v4-flash}}
      # Extra platform slots (from merged .env.models — see minibot/scripts/merge-env.sh)
      MINIBOT_SERVER_DEEPSEEK_PRO_API_KEY: ${MINIBOT_SERVER_DEEPSEEK_PRO_API_KEY:-}
      MINIBOT_SERVER_DEEPSEEK_PRO_BASE_URL: ${MINIBOT_SERVER_DEEPSEEK_PRO_BASE_URL:-}
      MINIBOT_SERVER_DEEPSEEK_PRO_MODEL: ${MINIBOT_SERVER_DEEPSEEK_PRO_MODEL:-}
      MINIBOT_SERVER_QWEN_API_KEY: ${MINIBOT_SERVER_QWEN_API_KEY:-}
      MINIBOT_SERVER_QWEN_BASE_URL: ${MINIBOT_SERVER_QWEN_BASE_URL:-}
      MINIBOT_SERVER_QWEN_MODEL: ${MINIBOT_SERVER_QWEN_MODEL:-}
      MINIBOT_SERVER_GLM_API_KEY: ${MINIBOT_SERVER_GLM_API_KEY:-}
      MINIBOT_SERVER_GLM_BASE_URL: ${MINIBOT_SERVER_GLM_BASE_URL:-}
      MINIBOT_SERVER_GLM_MODEL: ${MINIBOT_SERVER_GLM_MODEL:-}
      MINIBOT_SERVER_KIMI_API_KEY: ${MINIBOT_SERVER_KIMI_API_KEY:-}
      MINIBOT_SERVER_KIMI_BASE_URL: ${MINIBOT_SERVER_KIMI_BASE_URL:-}
      MINIBOT_SERVER_KIMI_MODEL: ${MINIBOT_SERVER_KIMI_MODEL:-}
      MINIBOT_SERVER_MINIMAX_API_KEY: ${MINIBOT_SERVER_MINIMAX_API_KEY:-}
      MINIBOT_SERVER_MINIMAX_BASE_URL: ${MINIBOT_SERVER_MINIMAX_BASE_URL:-}
      MINIBOT_SERVER_MINIMAX_MODEL: ${MINIBOT_SERVER_MINIMAX_MODEL:-}
      MINIBOT_SERVER_DOUBAO_API_KEY: ${MINIBOT_SERVER_DOUBAO_API_KEY:-}
      MINIBOT_SERVER_DOUBAO_BASE_URL: ${MINIBOT_SERVER_DOUBAO_BASE_URL:-}
      MINIBOT_SERVER_DOUBAO_MODEL: ${MINIBOT_SERVER_DOUBAO_MODEL:-}
      MINIBOT_SERVER_LANGFUSE_ENABLED: "true"
      MINIBOT_SERVER_LANGFUSE_HOST: http://server:8000
      MINIBOT_SERVER_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-demo}
      MINIBOT_SERVER_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-demo}
      MINIBOT_SERVER_DATA_DIR: /data
      MINIBOT_WEBUI_DIST: /app/webui-dist
      # UTC daily LLM budget (0 = unlimited). Kill-switch after limit.
      MINIBOT_SERVER_DAILY_TURN_LIMIT: ${MINIBOT_DAILY_TURN_LIMIT:-200}
      MINIBOT_SERVER_DAILY_TOKEN_LIMIT: ${MINIBOT_DAILY_TOKEN_LIMIT:-2000000}
      # exec sandbox: local (default) or e2b
      MINIBOT_SERVER_EXEC_BACKEND: ${MINIBOT_EXEC_BACKEND:-local}
      MINIBOT_SERVER_E2B_API_KEY: ${E2B_API_KEY:-}
      # Docker DNS service name; empty disables kb_* tools
      MINIBOT_SERVER_MINIKB_BASE_URL: ${MINIBOT_MINIKB_BASE_URL:-http://minikb:8080}
      MINIBOT_SERVER_MINIKB_API_KEY: ${MINIBOT_MINIKB_API_KEY:-}
      MINIBOT_SERVER_MINIKB_UI_URL: ${MINIBOT_MINIKB_UI_URL:-https://kb.liuyidi.me/ui/}
    volumes:
      - demo_minibot:/data
    ports:
      - "127.0.0.1:8766:8766"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8766/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    mem_limit: 512m
    networks: [demo]

volumes:
  demo_pg:
  demo_minio:
  demo_minibot:

networks:
  demo:
    driver: bridge
