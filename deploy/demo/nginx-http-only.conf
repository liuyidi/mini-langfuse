# Apex landing + product subdomains (HTTP). Certbot will add SSL.
#
# DNS needed:
#   @ / www / mlf / bot / kb  → ECS public IP
#
# Landing files:
#   /opt/demo/mini-langfuse/deploy/demo/landing/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream demo_mlf { server 127.0.0.1:8080; }
upstream demo_bot { server 127.0.0.1:8766; }
upstream demo_kb  { server 101.96.224.232:80; }

# ---------- Landing: liuyidi.me ----------
server {
    listen 80;
    listen [::]:80;
    server_name liuyidi.me www.liuyidi.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /opt/demo/mini-langfuse/deploy/demo/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mlf.liuyidi.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ui/stream {
        proxy_pass http://demo_mlf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://demo_mlf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bot.liuyidi.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://demo_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name kb.liuyidi.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        return 302 /ui/;
    }

    location / {
        proxy_pass http://demo_kb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
