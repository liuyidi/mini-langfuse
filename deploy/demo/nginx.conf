# Host Nginx for interview demo — one domain, three path prefixes.
#
#   https://YOUR_DOMAIN/      → mini-langfuse UI (:8080)
#   https://YOUR_DOMAIN/kb/  → Volcengine minikb (:8080)
#   https://YOUR_DOMAIN/bot/ → minibot Dev UI (:8766)
#
# Install:
#   sed "s/YOUR_DOMAIN/demo.example.com/g" nginx.conf | sudo tee /etc/nginx/sites-available/agent-demo
#   sudo ln -sf /etc/nginx/sites-available/agent-demo /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d demo.example.com
#
# Note: SPAs under subpaths may need hard-refresh; if /kb or /bot assets break,
# switch to subdomains (mlf./kb./bot.) — see README.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream demo_mlf  { server 127.0.0.1:8080; }
upstream demo_kb   { server 101.96.224.232:80; }
upstream demo_bot  { server 127.0.0.1:8766; }

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    # --- minibot (chat UI) ---
    location /bot/ {
        proxy_pass http://demo_bot/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # --- minikb ---
    location /kb/ {
        proxy_pass http://demo_kb/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- mini-langfuse SSE ---
    location /api/ui/stream {
        proxy_pass http://demo_mlf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # --- mini-langfuse (default) ---
    location / {
        proxy_pass http://demo_mlf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
