# Subdomain Nginx for liuyidi.me demo
#
#   https://mlf.liuyidi.me  → mini-langfuse (:8080)
#   https://bot.liuyidi.me  → minibot (:8766)
#   https://kb.liuyidi.me   → minikb (:8081)  [optional]
#
# Install (Ubuntu):
#   sudo cp nginx-subdomains.conf /etc/nginx/sites-available/liuyidi-demo
#   sudo ln -sf /etc/nginx/sites-available/liuyidi-demo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mlf.liuyidi.me -d bot.liuyidi.me -d kb.liuyidi.me

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream demo_mlf { server 127.0.0.1:8080; keepalive 16; }
upstream demo_bot { server 127.0.0.1:8766; keepalive 16; }
upstream demo_kb  { server 127.0.0.1:8081; keepalive 8; }

# ---------- HTTP (Certbot + redirect) ----------
server {
    listen 80;
    listen [::]:80;
    server_name mlf.liuyidi.me bot.liuyidi.me kb.liuyidi.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- mini-langfuse ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mlf.liuyidi.me;

    # iOS / React Native WebSocket uses SecureTransport and cannot reliably
    # negotiate TLS 1.3; keep TLS 1.2 only for mobile WebSocket compatibility.
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # Filled by certbot; placeholders until first certbot run:
    # ssl_certificate     /etc/letsencrypt/live/mlf.liuyidi.me/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mlf.liuyidi.me/privkey.pem;

    client_max_body_size 32m;

    location /api/ui/stream {
        proxy_pass http://demo_mlf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://demo_mlf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- minibot ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.liuyidi.me;

    # iOS / React Native WebSocket uses SecureTransport and cannot reliably
    # negotiate TLS 1.3; keep TLS 1.2 only for mobile WebSocket compatibility.
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    client_max_body_size 16m;

    location / {
        proxy_pass http://demo_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# ---------- minikb (optional; 502 until ./up.sh kb) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kb.liuyidi.me;

    # iOS / React Native WebSocket uses SecureTransport and cannot reliably
    # negotiate TLS 1.3; keep TLS 1.2 only for mobile WebSocket compatibility.
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64m;

    location / {
        proxy_pass http://demo_kb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
