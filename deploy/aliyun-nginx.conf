# Host Nginx site config for mini-langfuse on Aliyun ECS.
#
# Install:
#   sudo cp deploy/aliyun-nginx.conf /etc/nginx/sites-available/mini-langfuse
#   sudo ln -sf /etc/nginx/sites-available/mini-langfuse /etc/nginx/sites-enabled/
#   # Replace YOUR_DOMAIN below, then:
#   sudo certbot --nginx -d YOUR_DOMAIN
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisite: docker compose prod stack listening on 127.0.0.1:8080 (MLF_WEB_PORT).

# WebSocket upgrade map (harmless for plain HTTP; needed if you add WS later)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limit for login / auth (adjust as needed)
limit_req_zone $binary_remote_addr zone=mlf_auth:10m rate=10r/m;

upstream mlf_web {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # Certbot / Aliyun SSL — update paths after issuing cert
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MLF_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers (tune CSP if you add external scripts)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # SSE — real-time trace updates (must disable buffering)
    location /api/ui/stream {
        proxy_pass http://mlf_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Auth endpoints — light rate limit
    location ~ ^/api/(ui/)?auth/ {
        limit_req zone=mlf_auth burst=5 nodelay;
        proxy_pass http://mlf_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API + SPA (web container proxies /api/ to server)
    location / {
        proxy_pass http://mlf_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
