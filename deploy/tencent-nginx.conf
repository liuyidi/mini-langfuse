# Host Nginx for mini-langfuse on Tencent Cloud (mlf.liuyidi.me).
#
# Production host: 124.223.108.72
# Certbot already issued: /etc/letsencrypt/live/mlf.liuyidi.me/
#
# Install / refresh:
#   sudo cp deploy/tencent-nginx.conf /etc/nginx/sites-available/mini-langfuse
#   sudo ln -sf /etc/nginx/sites-available/mini-langfuse /etc/nginx/sites-enabled/mini-langfuse
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
# First-time cert:
#   sudo certbot --nginx -d mlf.liuyidi.me

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $mlf_fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

limit_req_zone $binary_remote_addr zone=mlf_auth:10m rate=10r/m;

upstream mlf_web {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mlf.liuyidi.me 124.223.108.72 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mlf.liuyidi.me$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mlf.liuyidi.me;

    # Filled / managed by certbot on the Tencent host:
    ssl_certificate     /etc/letsencrypt/live/mlf.liuyidi.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlf.liuyidi.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location /api/ui/stream {
        proxy_pass http://mlf_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mlf_fwd_proto;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location ~ ^/api/(ui/)?auth/ {
        limit_req zone=mlf_auth burst=5 nodelay;
        proxy_pass http://mlf_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mlf_fwd_proto;
    }

    location / {
        proxy_pass http://mlf_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mlf_fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
